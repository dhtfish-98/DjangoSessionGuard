[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "django-session-guard"
version = "0.1.2"
description = "Bounded offline static Django 5.2 session and CSRF settings review"
readme = "项目文档/README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["项目文档/LICENSE", "项目文档/NOTICE"]
authors = [{name = "dhtfish98"}]
maintainers = [{name = "dhtfish98"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security"]

[project.scripts]
django-session-guard = "django_session_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
django_session_guard = ["*.py"]
